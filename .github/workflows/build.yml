name: Build FireClient Mod
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: unzip fireclient-1.21.11.zip -d my_mod

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Mod
        run: |
          cd my_mod
          MOD_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          cd $MOD_DIR
          chmod +x gradlew
          ./gradlew build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: FireClient-Ready-To-Play
          path: my_mod/**/build/libs/*.jar
