name: Build FireClient Mod
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          mkdir -p my_mod
          unzip -q fireclient-1.21.11.zip -d my_mod

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Mod
        run: |
          cd my_mod
          BUILD_DIR=$(find . -name "build.gradle" -maxdepth 3 -exec dirname {} \;)
          cd "$BUILD_DIR"
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: FireClient-Ready-To-Play
          path: my_mod/**/build/libs/*.jar
          
